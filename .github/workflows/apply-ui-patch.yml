name: Apply BananaNative UI patch series

on:
  push:
    branches:
      - apply/application-ui-next
    paths:
      - android...feature_application-ui-next.txt

permissions:
  contents: write

concurrency:
  group: apply-ui-patch-{{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-patch-series:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: apply/application-ui-next
          fetch-depth: 0

      - name: Apply the 94-commit patch series
        shell: bash
        run: |
          set -euo pipefail
          PATCH_FILE="android...feature_application-ui-next.txt"

          if [[ ! -s "$PATCH_FILE" ]]; then
            echo "::error::Patch file is missing or empty: $PATCH_FILE"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path("android...feature_application-ui-next.txt").read_text()
          starts = list(re.finditer(r"^From [0-9a-f]{40} ", source, re.M))
          if len(starts) != 94:
              raise SystemExit(f"Expected 94 patches, found {len(starts)}")
          patches = [
              source[m.start():(starts[i + 1].start() if i + 1 < len(starts) else len(source))]
              for i, m in enumerate(starts)
          ]
          # Patch 1 only changes wording in a legacy hard-coded label. Upstream
          # uses a localized string resource, so that tiny wording patch cannot
          # apply verbatim; the substantive UI changes follow in later patches.
          Path("/tmp/ui-series.mbox").write_text("".join(patches[1:]))
          PY

          if ! git am --3way /tmp/ui-series.mbox; then
            git am --abort || true
            echo "::error::Patch series could not be applied cleanly. No patch commits were pushed."
            exit 1
          fi

          git rm -- "$PATCH_FILE"
          git commit -m "Remove uploaded UI patch bundle"
          git push origin HEAD:apply/application-ui-next
